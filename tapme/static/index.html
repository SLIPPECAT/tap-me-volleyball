<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Me Volleyball</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tap Me">
<meta name="theme-color" content="#0f0d0b">
<meta name="description" content="경기 영상에서 우리 팀 득점 장면을 찾아, 나를 고르면 세로 하이라이트를 만들어 줍니다.">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1>Tap Me Volleyball</h1>
    <div class="langs-ui" role="group" aria-label="Language">
      <button data-lang="ko">한</button><button data-lang="ja">日</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>
<main>
  <p class="error" id="error" role="alert" hidden></p>

  <!-- 기기에서 흐리는 중(브라우저 방식): 원본은 기기에 있어 이 화면을 켜 둬야 한다 -->
  <section id="local-box" class="card" hidden>
    <p id="local-step" aria-live="polite"></p>
    <div class="progress" id="local-progress"><div></div></div>
    <p class="error" data-t="localKeepOpen"></p>
    <p class="muted" id="charge-tip" data-t="chargeTip" hidden></p>
    <button class="primary" id="resume-local" data-t="resumeLocal" hidden></button>
  </section>

  <!-- 기기 처리가 멈춘 작업(화면을 새로 열었거나 끊김): 같은 영상을 다시 고르면 빠진 조각부터 이어 처리 -->
  <section id="resume-box" class="card" hidden>
    <p id="resume-note"></p>
    <input type="file" id="resume-file" accept="video/*" hidden>
    <button class="primary" id="resume-go" data-t="resumeLocal" hidden></button>
  </section>

  <!-- 처리 중: 지금 단계 + 닫아도 됨 + 그동안 옵션 미리 정하기 -->
  <section id="wait-box" class="card" hidden>
    <p id="wait-step" aria-live="polite"></p>
    <p class="muted" id="wait-cost" hidden></p>
    <div class="progress" id="wait-progress"><div></div></div>
    <p class="muted" id="can-close" data-t="canClose"></p>
    <p><button id="copy-link" data-t="copyLink"></button></p>
    <details id="prefs-box">
      <summary data-t="prefsTitle"></summary>
      <div class="field"><label for="team-pref" data-t="teamLabel"></label><input type="text" id="team-pref" maxlength="20"></div>
      <div id="opts-prefs"></div>
    </details>
  </section>

  <!-- 1. 영상 올리기 -->
  <section id="s-upload">
    <p data-t="uploadIntro"></p>
    <p class="muted" data-t="captureTip"></p>
    <p><a href="/static/guide.html" id="guide-link" data-t="guideLink"></a></p>
    <div class="bench" id="bench-box" hidden>
      <button id="bench-go"></button>
      <div class="progress" id="bench-progress" hidden><div></div></div>
      <p class="muted" id="bench-result" aria-live="polite"></p>
    </div>
    <div class="field" id="code-field" hidden><label for="code" data-t="codeLabel"></label><input type="text" id="code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
    <p class="muted" id="access-status" aria-live="polite"></p>
    <p class="muted" id="wipe-note" hidden></p>
    <div class="consent" id="consent">
      <p><strong data-t="consentTitle"></strong></p>
      <ul><li data-t="consent1"></li><li data-t="consent2"></li><li data-t="consent3"></li><li data-t="consent4"></li></ul>
      <label class="check"><input type="checkbox" id="consent-check"> <span data-t="consentCheck"></span></label>
    </div>
    <div class="field"><label for="match-name" data-t="matchLabel"></label><input type="text" id="match-name" maxlength="40"></div>
    <label class="drop"><span data-t="pickVideo"></span><small data-t="dropHint"></small><input type="file" id="file" accept="video/*"></label>
    <div class="picked" id="picked" hidden>
      <p id="picked-name"></p>
      <div class="range" id="range" hidden>
        <p class="muted" id="range-note"></p>
        <video id="range-video" muted playsinline controls preload="metadata"></video>
        <div class="range-bar" aria-hidden="true"><div id="range-fill"></div></div>
        <p class="range-label" id="range-label" aria-live="polite"></p>
        <div class="range-btns"><button id="range-start" data-t="rangeStart"></button><button id="range-end" data-t="rangeEnd"></button></div>
        <div class="range-btns"><button id="range-first"></button><button id="range-next"></button><button id="range-last"></button></div>
      </div>
      <button class="primary" id="start-upload" data-t="startUpload"></button>
      <p class="started" id="started-note" aria-live="polite" hidden></p>
      <!-- 시작 전 선택(10/31 사용자: 대기 시간·폰 사용을 고려): 기기 속도를 재 두 방식의 예상 시간을 보여 준다 -->
      <div class="choice" id="choice" hidden>
        <p id="choice-note" aria-live="polite"></p>
        <div class="progress" id="probe-progress" hidden><div></div></div>
        <p class="muted" id="push-hint" hidden></p>
        <button class="option" id="choose-device"><strong data-t="optDevice"></strong><span id="device-est"></span><small data-t="optDeviceHint"></small></button>
        <button class="option" id="choose-server"><strong data-t="optServer"></strong><span id="server-est"></span><small data-t="optServerHint"></small></button>
      </div>
    </div>
    <div class="progress" id="up-progress" hidden><div></div></div>
    <p class="muted" id="up-status" aria-live="polite"></p>
    <button class="primary" id="resume-upload" data-t="resumeUpload" hidden></button>
    <p class="error" id="upload-warn" data-t="keepOpen" hidden></p>
  </section>

  <!-- 2. 랠리 후보 -->
  <section id="s-rallies" hidden>
    <h2 data-t="pickRally"></h2>
    <div class="card" id="refile" hidden>
      <p data-t="refileNote"></p>
      <input type="file" id="refile-input" accept="video/*">
    </div>
    <p class="muted" data-t="pickRallyHint"></p>
    <div class="batch-bar">
      <button id="batch-toggle" data-t="batchToggle"></button>
      <p class="muted" id="batch-status" aria-live="polite"></p>
    </div>
    <p class="muted" id="left-note" hidden></p>
    <p class="card muted" id="scan-note" aria-live="polite" hidden></p>
    <div id="rally-list"></div>
    <div class="batch-go" id="batch-go" hidden><button class="primary" id="batch-start"></button></div>
    <p class="card muted" id="no-rallies" data-t="noRallies" hidden></p>
    <p class="card muted" id="unread" hidden></p>
    <div id="reel-box" hidden>
      <h2 data-t="reelTitle"></h2>
      <p class="muted" data-t="reelHint"></p>
      <div id="reel-pick"></div>
      <button class="primary" id="make-reel" data-t="makeReel"></button>
      <p class="muted" id="reel-status" aria-live="polite"></p>
      <video id="reel" controls playsinline hidden></video>
      <div class="actions" id="reel-actions" hidden>
        <button id="reel-share" data-t="share"></button><a id="reel-download" download="reel.mp4"><button style="width:100%" data-t="save"></button></a>
      </div>
    </div>
  </section>

  <!-- 3. 나를 탭 -->
  <section id="s-tap" hidden>
    <h2 data-t="tapTitle"></h2>
    <p class="muted" id="tap-status" aria-live="polite"></p>
    <div id="tap-box" hidden>
      <div class="tap-main">
        <div class="moments" id="moments" role="tablist"></div>
        <p class="muted" id="players-status" aria-live="polite"></p>
        <div id="tapper-host"></div>
        <p><button id="clear-tap" data-t="clearTap"></button></p>
      </div>
      <div class="tap-side">
        <div class="field">
          <label for="team" data-t="teamLabel"></label>
          <input type="text" id="team" maxlength="20">
        </div>
        <div id="opts-tap"></div>
        <button class="primary" id="make" disabled data-t="make"></button>
        <p><button id="back-rallies" data-t="otherRally"></button></p>
      </div>
    </div>
  </section>

  <!-- 4. 결과 -->
  <section id="s-result" hidden>
    <h2 data-t="resultTitle"></h2>
    <p class="muted" id="result-status" aria-live="polite"></p>
    <div class="result-grid">
      <div class="result-main">
        <video id="result" controls playsinline hidden></video>
        <div class="actions" id="result-actions" hidden>
          <button id="share" data-t="share"></button><a id="download" download="highlight.mp4"><button style="width:100%" data-t="save"></button></a>
        </div>
        <!-- 결과마다 한 번에 의견(10/31 사용자: 베타 의견 받기) -->
        <div class="rate" id="rate" hidden>
          <p data-t="rateQ"></p>
          <div class="rate-btns"><button data-rate="good" data-t="rateGood"></button><button data-rate="bad" data-t="rateBad"></button></div>
        </div>
      </div>
      <div class="result-side">
        <h2 data-t="changeOptions"></h2>
        <p class="muted" data-t="rerenderHint"></p>
        <div id="opts-result"></div>
        <button class="primary" id="rerender" data-t="rerender"></button>
        <p><button id="back-rallies2" data-t="otherRally"></button></p>
      </div>
    </div>
  </section>

  <p class="muted" id="spent"></p>

  <!-- 의견 남기기: 어떤 작업·장면이었는지 함께 보낸다(영상은 보내지 않음). 운영 현황(admin)에서 본다 -->
  <details class="card feedback" id="feedback">
    <summary data-t="feedbackTitle"></summary>
    <div class="rate-btns" id="fb-rating"><button data-rate="good" data-t="rateGood"></button><button data-rate="bad" data-t="rateBad"></button></div>
    <textarea id="fb-text" maxlength="2000" rows="4"></textarea>
    <input type="text" id="fb-contact" maxlength="100">
    <button class="primary" id="fb-send" data-t="fbSend"></button>
    <p class="muted" id="fb-status" aria-live="polite"></p>
    <p><a href="/static/guide.html" data-t="guideLink"></a></p>
  </details>
</main>

<template id="tapper-tpl">
  <div class="cards" role="listbox"></div>
  <div class="zoombar">
    <button class="zout" aria-label="zoom out">−</button>
    <button class="zin" aria-label="zoom in">+</button>
    <span class="muted" data-t="zoomHint"></span>
  </div>
  <div class="tapzoom"><div class="tapwrap"><div class="marker"></div><div class="pickbox"></div></div></div>
</template>

<template id="opts-tpl">
  <div class="field"><label class="switch"><input type="checkbox" class="subs-on"> <span data-t="subsOn"></span></label></div>
  <div class="subs-box" hidden>
    <div class="field sublangs">
      <label data-t="subLangs"></label>
      <label><input type="checkbox" value="ko"> 한국어</label>
      <label><input type="checkbox" value="ja"> 日本語</label>
      <label><input type="checkbox" value="en"> English</label>
    </div>
    <div class="field"><label data-t="role"></label>
      <select class="role">
        <option value="" data-t="roleNone"></option>
        <option value="score" data-t="roleScore"></option>
        <option value="assist" data-t="roleAssist"></option>
        <option value="defense" data-t="roleDefense"></option>
      </select></div>
  </div>
  <div class="field"><label class="switch"><input type="checkbox" class="face-mosaic" checked> <span data-t="faceMosaic"></span></label></div>
  <div class="opts">
    <div class="field"><label data-t="privacy"></label>
      <select class="privacy">
        <option value="face" data-t="privFace"></option>
        <option value="silhouette" data-t="privSilhouette"></option>
        <option value="background" data-t="privBackground"></option>
      </select></div>
    <div class="field"><label data-t="zoom"></label>
      <select class="zoom">
        <option value="1" selected>1×</option><option value="1.5">1.5×</option>
        <option value="2">2×</option><option value="2.5">2.5×</option>
      </select></div>
    <div class="field"><label data-t="fps"></label>
      <select class="fps"><option value="0" selected data-t="fpsSource"></option><option value="30" data-t="fps30"></option></select></div>
  </div>
</template>

<script src="/static/browser-blur.js"></script>
<script>

  ko: {

  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs-ui button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("team").placeholder = t("teamPh");
  $("fb-text").placeholder = t("fbPlaceholder"); $("fb-contact").placeholder = t("fbContact");
  renderRange();
  showBench();
  $("rally-list").dataset.key = "";  // 판정 이유를 새 언어로 다시 그린다
  if (state.last) render(state.last);
}
function initLang() {
  const saved = storeGet("lang");
  const nav = (navigator.language || "en").slice(0, 2);
  state.lang = T[saved] ? saved : T[nav] ? nav : "en";
  document.querySelectorAll(".langs-ui button").forEach((b) => { b.onclick = () => { state.lang = b.dataset.lang; storeSet("lang", state.lang); applyLang(); }; });
  applyLang();
}

function show(section) { for (const s of ["s-upload", "s-rallies", "s-tap", "s-result"]) $(s).hidden = s !== section; }
function setError(msg) { $("error").textContent = msg || ""; $("error").hidden = !msg; }
// 기기 쪽 오류(처리 멈춤 등)는 서버 상태를 다시 그려도 남겨 둔다(2초마다 서버 오류로 덮여 안 보였다, 10/31 아이폰)
function setLocalError(msg) { state.localError = msg || ""; setError(msg); }
function setHash() { location.hash = state.job ? `job=${state.job}` + (state.rally !== null ? `&rally=${state.rally}` : "") : ""; }
function fmt(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${String(s).padStart(2, "0")}`; }
function reasonText(r) { return r && typeof r === "object" ? (r[state.lang] || r.en || "") : (r || ""); }
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw Object.assign(new Error((await r.json().catch(() => ({}))).detail || t("reqFail", { c: r.status })), { status: r.status });
  return r.json();
}
const postJson = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function readOptions(box) {
  // 자막을 끄면 언어를 보내지 않는다 → 서버는 해설(Muse)을 묻지 않는다
  const on = box.querySelector(".subs-on").checked;
  const langs = [...box.querySelectorAll(".sublangs input:checked")].map((c) => c.value);
  return {
    languages: on ? (langs.length ? langs : [state.lang]) : [],
    role: on ? box.querySelector(".role").value : "",
    privacy: box.querySelector(".privacy").value,
    zoom: parseFloat(box.querySelector(".zoom").value),
    fps: parseInt(box.querySelector(".fps").value, 10),
    face_mosaic: box.querySelector(".face-mosaic").checked,
  };
}
function mountOptions(boxId, o) {
  const box = $(boxId);
  box.replaceChildren($("opts-tpl").content.cloneNode(true));
  box.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  const langs = o && o.languages.length ? o.languages : [state.lang];
  box.querySelectorAll(".sublangs input").forEach((c) => { c.checked = langs.includes(c.value); });
  const on = box.querySelector(".subs-on"), subsBox = box.querySelector(".subs-box");
  on.checked = Boolean(o && o.languages.length);
  subsBox.hidden = !on.checked;
  on.onchange = () => { subsBox.hidden = !on.checked; };
  if (o) {
    box.querySelector(".privacy").value = o.privacy; box.querySelector(".zoom").value = String(o.zoom); box.querySelector(".fps").value = String(o.fps || 0);
    box.querySelector(".role").value = o.role || "";
    box.querySelector(".face-mosaic").checked = o.face_mosaic !== false;
  }
}

// 상태를 2초마다 보고 지금 단계의 화면을 그린다
function startPolling() {
  clearInterval(state.poll);
  subscribePush(state.job);  // 알림을 허용한 기기면 이 작업도 알린다(링크로 다시 들어온 경우 포함)
  const tick = async () => {
    try { state.last = await api(`/jobs/${state.job}`); } catch (e) { setError(e.message); return; }
    render(state.last);
  };
  tick();
  state.poll = setInterval(tick, 2000);
}

function busyOf(s) {
  if (s.status === "uploaded" || s.status === "finding_rallies") return true;
  const sc = state.rally !== null && s.scenes[String(state.rally)];
  if (sc && (sc.status === "preparing" || sc.status === "rendering" || sc.status === "queued")) return true;
  return Boolean(s.reel && s.reel.status === "rendering");
}

function renderWait(s) {
  const busy = busyOf(s) && !s.error;
  $("wait-box").hidden = !busy;
  // 기기 방식에서 조각이 남아 있으면 기기가 해야 해서 닫으면 멈춘다(서버 혼자 계속하지 않는다)
  $("can-close").hidden = Boolean(state.localBusy) || (s.mode === "browser" && (s.chunks_received || []).length < ((s.scan || {}).total || 0));
  if (busy) {
    const sc = state.rally !== null && s.scenes[String(state.rally)];
    const sceneBusy = sc && (sc.status === "preparing" || sc.status === "rendering");
    const pr = s.status === "finding_rallies" && !sceneBusy ? { step: "rallies", ...(s.scan || {}) } : (s.progress || {});
    const key = pr.step ? "st" + pr.step[0].toUpperCase() + pr.step.slice(1) : "stWorking";
    const pct = pr.total ? Math.round(100 * pr.done / pr.total) : 0;
    $("wait-step").textContent = t(T[state.lang][key] ? key : "stWorking", { d: pr.done || 0, n: pr.total || 0, p: pct })
      + (s.status === "finding_rallies" && !sceneBusy ? scanEta(s) : "");
    $("wait-progress").hidden = !pr.total;
    if (s.status === "uploaded" && s.queue) $("wait-step").textContent = t("stQueue", { n: s.queue });
    // 긴 영상은 오래 걸리고 비용도 커서 랠리 찾는 동안 길이와 예상 비용을 보여 준다
    $("wait-cost").hidden = !(s.status === "finding_rallies" && s.estimate_usd);
    if (!$("wait-cost").hidden) $("wait-cost").textContent = t("waitCost", { m: Math.max(1, Math.round(((s.scan_range || []).length === 2 ? s.scan_range[1] - s.scan_range[0] : s.duration_sec) / 60)), u: s.estimate_usd.toFixed(2) });
    $("wait-progress").firstElementChild.style.transform = `scaleX(${pct / 100})`;
    if (!$("opts-prefs").children.length) {
      mountOptions("opts-prefs", state.prefs.options);
      $("team-pref").value = state.prefs.team || "";
    }
  }
  // 처리가 끝나면 진동, 화면을 안 보고 있으면 탭 제목에 ✓
  if (state.busy && !busy && !s.error) {
    if (navigator.vibrate) navigator.vibrate(200);
    if (document.hidden) document.title = "✓ " + BASE_TITLE;
  }
  state.busy = busy;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = BASE_TITLE; });
$("team-pref").addEventListener("input", () => { state.prefs.team = $("team-pref").value; savePrefs(); });
$("opts-prefs").addEventListener("change", () => { state.prefs.options = readOptions($("opts-prefs")); savePrefs(); });
$("copy-link").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("copy-link").textContent = t("copied"); }
  catch { prompt("", location.href); }  // http 주소에서는 클립보드가 막힐 수 있다
};

function render(s) {
  setError(s.error || state.localError);
  const active = Object.values(s.scenes).filter((x) => x.status === "queued" || x.status === "rendering").length;
  if (state.active > 0 && active === 0 && !s.error) {
    if (navigator.vibrate) navigator.vibrate(200);
    if (document.hidden) document.title = "✓ " + BASE_TITLE;
  }
  state.active = active;
  renderWait(s);
  $("spent").textContent = t("spent", { u: s.spent_usd.toFixed(3) });
  // 브라우저 방식인데 화면을 새로 열어 기기 원본과 연결이 끊겼으면 같은 영상을 다시 고르게 한다
  $("refile").hidden = !(s.mode === "browser" && !state.local);
  // 기기 처리가 멈춘 채 조각이 빠져 있으면(새로 열었거나 끊김) 이어서 처리하기를 보인다
  const stalled = s.mode === "browser" && s.status === "finding_rallies" && !state.localBusy
    && (s.chunks_received || []).length < ((s.scan || {}).total || 0);
  $("resume-box").hidden = !stalled || !$("resume-local").hidden;
  if (stalled) {
    $("resume-note").textContent = t(state.local ? "resumeNoteHave" : "resumeNote");
    $("resume-file").hidden = Boolean(state.local); $("resume-go").hidden = !state.local;
  }
  $("left-note").hidden = !s.left;
  if (s.left) $("left-note").textContent = t("leftNote", { h: s.left.highlights });
  if (state.rally === null) return renderRallies(s);
  const scene = s.scenes[String(state.rally)];
  if (!scene || scene.status === "preparing") {
    show("s-tap"); $("tap-status").textContent = s.error ? "" : t(state.segUploading === state.rally ? "segUploading" : "preparing"); $("tap-box").hidden = true;
  } else if (scene.status === "awaiting_tap" || scene.status === "failed") {
    show("s-tap"); renderTap();
    $("make").textContent = batchLabel() || t("make");
  } else if (scene.status === "queued") {
    const turn = (s.render_turns || {})[String(state.rally)];
    show("s-tap"); $("tap-status").textContent = turn ? t("queuedTurn", { n: turn }) : t("queuedMsg"); $("tap-box").hidden = true;
  } else if (scene.status === "rendering") {
    if ($("s-result").hidden) { show("s-tap"); $("tap-status").textContent = t("rendering") + renderEta(); $("tap-box").hidden = true; }
    else { $("result-status").textContent = t("rerenderBusy"); }
    $("make").disabled = $("rerender").disabled = true;
  } else if (scene.status === "done") {
    renderResult(scene);
  }
}

// 만드는 중 남은 시간: 이 화면이 만들기를 처음 본 때부터 서버 예상(est.highlight_sec)을 뺀다. 고정 문구 "(2~3분)"은
// 실제(5분 20초)와 달랐다(10/31 아이폰)
function renderEta() {
  const key = `${state.job}/${state.rally}`;
  if (!state.renderSeen || state.renderSeen.key !== key) state.renderSeen = { key, t0: Date.now() };
  const left = ((state.est || {}).highlight_sec || 600) - (Date.now() - state.renderSeen.t0) / 1000;
  return " " + (left > 30 ? t("etaLeft", { m: fmtLeft(left), c: clockAt(left) }) : t("renderAlmost"));
}

function renderRallies(s) {
  // 처리 중에는 올리기 칸을 숨긴다(다시 올리는 실수 방지). 기다림 상자가 대신 보인다
  // 긴 영상은 찾은 랠리부터 보여 주어 다 끝나기 전에 골라 만들 수 있게 한다(10/30)
  const partial = s.status === "finding_rallies" && s.rallies.length > 0;
  show(s.status === "rallies_ready" || partial ? "s-rallies" : busyOf(s) && !s.error ? null : "s-upload");
  if (s.status !== "rallies_ready" && !partial) { $("up-status").textContent = s.error ? "" : t("findingRallies"); return; }
  $("scan-note").hidden = !partial;
  if (partial) $("scan-note").textContent = t("scanNote", { d: (s.scan || {}).done || 0, n: (s.scan || {}).total || 0 });
  renderReel(s);
  $("no-rallies").hidden = s.rallies.length > 0 || partial;
  const unread = s.unread || [];
  $("unread").hidden = !unread.length;
  $("unread").textContent = t("unread", { r: unread.map(([a, b]) => `${fmt(a)}~${fmt(b)}`).join(", ") });
  const list = $("rally-list");
  renderBatchBar(s);
  const key = `${state.job}|${state.lang}|${s.rallies.length}|${state.batchMode}|${Object.entries(s.scenes).map(([k, v]) => k + v.status).join(",")}`;
  if (list.dataset.key === key) return;
  list.dataset.key = key;
  // 찾는 도중 붙은 랠리는 번호 순서가 시간 순서와 다를 수 있어 시간 순으로 보여 준다
  list.replaceChildren(...[...s.rallies].sort((a, b) => a.start_sec - b.start_sec).map((r) => {
    const scene = s.scenes[String(r.index)];
    const card = document.createElement("div"); card.className = "card rally";
    // 장면 사진. 누르면 그 구간 미리보기를 카드 안에서 재생한다(시간만으로는 어떤 장면인지 모른다)
    const thumb = document.createElement("button"); thumb.className = "thumb"; thumb.setAttribute("aria-label", t("preview"));
    const img = document.createElement("img"); img.loading = "lazy"; img.alt = "";
    if (s.mode !== "browser") img.src = `/jobs/${state.job}/rallies/${r.index}/thumb`;
    else if (state.local) localThumb((r.start_sec + r.end_sec) / 2).then((u) => { img.src = u; });  // 원본은 기기에만 있다
    const play = document.createElement("span"); play.textContent = "▶";
    thumb.append(img, play);
    thumb.onclick = () => {
      // 미리보기를 보는 동안 뒤에서 장면을 미리 준비한다(비용 없을 때만, 서버가 판단). 고르면 탭 화면이 바로 뜬다
      fetch(`/jobs/${state.job}/rallies/${r.index}/prepare?ahead=true`, { method: "POST" }).catch(() => {});
      const v = document.createElement("video");
      if (s.mode === "browser") {
        if (!state.local) { setError(t("localNoFile")); return; }
        v.src = `${state.local.url}#t=${Math.max(0, r.start_sec - 1).toFixed(1)},${(r.end_sec + 1).toFixed(1)}`;  // 기기의 원본 그 구간
      } else v.src = `/jobs/${state.job}/rallies/${r.index}/preview`;
      v.controls = true; v.autoplay = true; v.playsInline = true;
      thumb.replaceWith(v);
    };
    const info = document.createElement("div");
    const row = document.createElement("div"); row.className = "row";
    const time = document.createElement("strong"); time.textContent = `${fmt(r.start_sec)} ~ ${fmt(r.end_sec)}`;
    const tag = document.createElement("span");
    const st = scene && scene.status;
    const kind = ["done", "queued", "rendering", "failed"].includes(st) ? st : r.uncertain ? "unsure" : r.is_rally ? "yes" : "no";
    tag.className = `tag ${kind}`;
    tag.textContent = t({ done: "done", queued: "queued", rendering: "making", failed: "failed", unsure: "unsure", yes: "rally", no: "notRally" }[kind]);
    row.append(time, tag);
    const reason = document.createElement("p"); reason.className = "muted"; reason.textContent = reasonText(r.reason);
    const pick = document.createElement("button"); pick.textContent = scene ? t("open") : t("makeFromRally");
    pick.onclick = async () => {
      state.rally = r.index; setHash();
      // 이미 준비했거나 만든 장면은 그대로 연다. 다시 준비하면 돈이 또 들고 결과가 지워진다
      const sc = state.last && state.last.scenes[String(r.index)];
      // 미리 준비 중(preparing)이면 기다리기만 한다. 준비하다 실패했을 때만 다시 요청
      if (!sc || (sc.status === "preparing" && state.last.error)) {
        try { await prepareRally(r.index); } catch (e) { setError(e.message); }
      }
      startPolling();
    };
    if (state.batchMode && !["done", "queued", "rendering"].includes(st)) {
      const box = document.createElement("label"); box.className = "pick-check";
      const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: state.picked.has(r.index) });
      cb.onchange = () => { cb.checked ? state.picked.add(r.index) : state.picked.delete(r.index); renderBatchBar(state.last); };
      box.append(cb, document.createTextNode(" " + t("pickThis")));
      info.append(row, reason, box);
    } else {
      info.append(row, reason, pick);
    }
    card.append(thumb, info);
    return card;
  }));
}

// 여러 랠리 한꺼번에(10/30 사용자): 고른 랠리마다 나를 탭해 예약하면 서버가 뒤에서 차례로 만든다(화면을 닫아도 됨)
// 한 번에 예약은 BATCH_MAX개까지(서버 jobs.MAX_ACTIVE_SCENES와 같게). 이미 대기·만드는 중인 장면도 센다
const BATCH_MAX = 5;
function batchRoom(s) {
  const room = BATCH_MAX - Object.values((s && s.scenes) || {}).filter((x) => x.status === "queued" || x.status === "rendering").length;
  return Math.min(room, s && s.left ? s.left.highlights : room);  // 코드의 남은 하이라이트 수까지만
}
// 브라우저 방식의 장면 사진: 기기의 원본에서 그 시각 한 장을 그린다(한 번에 하나씩, 같은 영상 요소를 돌려 쓴다)
$("refile-input").addEventListener("change", () => {
  const f = $("refile-input").files[0];
  if (!f) return;
  if (state.last && state.last.source_size && f.size !== state.last.source_size) { setError(t("refileWrong")); return; }
  setError(""); state.local = { file: f, url: URL.createObjectURL(f) };
  $("rally-list").dataset.key = ""; render(state.last);
});
let thumbQueue = Promise.resolve();
function localThumb(sec) {
  thumbQueue = thumbQueue.then(() => new Promise((ok) => {
    const v = state.local.thumbVideo || (state.local.thumbVideo = Object.assign(document.createElement("video"), { muted: true, playsInline: true, preload: "auto", src: state.local.url }));
    const draw = () => {
      const c = document.createElement("canvas"), w = 480;
      c.width = w; c.height = Math.round(w * v.videoHeight / v.videoWidth);
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.7));
    };
    const go = () => { if (Math.abs(v.currentTime - sec) < 0.05) draw(); else { v.onseeked = draw; v.currentTime = sec; } };
    v.onerror = () => ok("");
    setTimeout(() => ok(""), 5000);  // 못 그리면 사진 없이 넘어간다(줄이 멈추지 않게)
    if (v.readyState >= 1) go(); else v.onloadedmetadata = go;
  }));
  return thumbQueue;
}

function renderBatchBar(s) {
  $("batch-toggle").textContent = t(state.batchMode ? "batchCancel" : "batchToggle");
  $("batch-go").hidden = !state.batchMode || state.picked.size === 0;
  $("batch-start").textContent = t("batchStart", { n: state.picked.size });
  // 다 찼으면 나머지 체크를 막고 이유를 보여 준다
  const full = state.picked.size >= batchRoom(s);
  document.querySelectorAll(".pick-check input").forEach((cb) => { cb.disabled = full && !cb.checked; });
  const sc = Object.values((s && s.scenes) || {});
  const r = sc.filter((x) => x.status === "rendering").length, q = sc.filter((x) => x.status === "queued").length;
  const d = sc.filter((x) => x.status === "done").length;
  $("batch-status").textContent = state.batchMode && full ? t("batchMax", { m: BATCH_MAX }) : r + q ? t("batchStatus", { r, q, d }) : "";
}
$("batch-toggle").onclick = () => { state.batchMode = !state.batchMode; state.picked.clear(); render(state.last); };
$("batch-start").onclick = async () => {
  const byTime = (i) => (state.last.rallies.find((r) => r.index === i) || {}).start_sec || 0;
  state.batch = [...state.picked].sort((a, b) => byTime(a) - byTime(b));
  state.batchMode = false; state.picked.clear();
  // 고른 랠리를 모두 미리 준비해 둔다(서버가 하나씩 처리). 탭 화면은 첫 랠리부터
  for (const i of state.batch) {
    if (!state.last.scenes[String(i)]) await prepareRally(i).catch((e) => setError(e.message));
  }
  state.rally = state.batch[0]; setHash(); startPolling();
};
// 장면 준비. 브라우저 방식은 먼저 그 랠리 구간을 기기 원본에서 잘라 올린다(다시 압축하지 않음, 원본 화질·소리 그대로)
const SEG_BEFORE = 8, SEG_AFTER = 6;  // 서버 jobs.SEGMENT_BEFORE_SEC·SEGMENT_AFTER_SEC와 같게
async function prepareRally(i) {
  const s = state.last, r = s.rallies.find((x) => x.index === i);
  if (s.mode === "browser" && !(s.segments || []).includes(String(i))) {
    if (!state.local) throw new Error(t("localNoFile"));
    state.segUploading = i; render(s);
    try {
      const seg = await BrowserBlur.extractSegment(state.local.file, Math.max(0, r.point_sec - SEG_BEFORE), r.point_sec + SEG_AFTER);
      const form = new FormData();
      form.append("video", seg.video, "video.mp4"); form.append("start", String(seg.start));
      if (seg.audio) form.append("audio", seg.audio, "audio.mp4");
      await api(`/jobs/${state.job}/rallies/${i}/segment`, { method: "POST", body: form });
    } finally { state.segUploading = null; }
  }
  await api(`/jobs/${state.job}/rallies/${i}/prepare`, { method: "POST" });
}
function batchLabel() {
  const i = state.batch.indexOf(state.rally);
  if (i < 0) return null;

// 탭할 장면 하나: 확대(1~4배) + 탭 위치 표시. 화면 위치를 원본 이미지 픽셀로 바꿔 둔다(확대해도 같은 계산)
function makeTapper(boxId, which, players) {
  const box = $(boxId);
  box.replaceChildren($("tapper-tpl").content.cloneNode(true));
  box.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  const zoomBox = box.querySelector(".tapzoom"), wrap = box.querySelector(".tapwrap");
  // 장면 사진은 주소가 정해질 때 만든다(빈 img를 미리 두지 않는다)
  box.querySelector(".tapwrap").prepend(Object.assign(document.createElement("img"), { alt: "" }));
  const img = box.querySelector(".tapwrap img"), marker = box.querySelector(".marker"), pickbox = box.querySelector(".pickbox");
  const cards = box.querySelector(".cards");
  const unpick = () => { cards.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", "false")); pickbox.style.display = "none"; };
  // 선수 카드: 고르면 사진 위 그 선수에 테두리. 박스는 원본 이미지 픽셀 → 비율로 그린다
  cards.hidden = !players.length;
  players.forEach(([l, tp, r, b], n) => {
    const btn = document.createElement("button");
    btn.setAttribute("role", "option"); btn.setAttribute("aria-selected", "false"); btn.setAttribute("aria-label", `#${n + 1}`);
    const im = document.createElement("img"); im.alt = ""; im.loading = "lazy";
    im.src = `/jobs/${state.job}/rallies/${state.rally}/player?which=${which}&n=${n}`;
    btn.append(im);
    btn.onclick = () => {
      unpick(); btn.setAttribute("aria-selected", "true"); marker.style.display = "none";
      state.taps[which] = { player: n };
      const W = img.naturalWidth || 1080, H = img.naturalHeight || 1920;
      Object.assign(pickbox.style, { left: `${100 * l / W}%`, top: `${100 * tp / H}%`, width: `${100 * (r - l) / W}%`,
                                     height: `${100 * (b - tp) / H}%`, display: "block" });
      $("make").disabled = !anyTap(); markMoments();
    };
    cards.append(btn);
  });
  let zoom = 1;
  const setZoom = (z) => {
    zoom = Math.min(4, Math.max(1, z));
    const cx = (zoomBox.scrollLeft + zoomBox.clientWidth / 2) / wrap.offsetWidth, cy = (zoomBox.scrollTop + zoomBox.clientHeight / 2) / wrap.offsetHeight;
    wrap.style.width = `${zoom * 100}%`;
    zoomBox.scrollLeft = cx * wrap.offsetWidth - zoomBox.clientWidth / 2;
    zoomBox.scrollTop = cy * wrap.offsetHeight - zoomBox.clientHeight / 2;
  };
  box.querySelector(".zin").onclick = () => setZoom(zoom + 1);
  box.querySelector(".zout").onclick = () => setZoom(zoom - 1);
  img.alt = t("tapTitle");
  img.src = `/jobs/${state.job}/rallies/${state.rally}/tap-frame?which=${which}`;
  img.addEventListener("click", (ev) => {
    const rect = img.getBoundingClientRect();
    state.taps[which] = { x: Math.round((ev.clientX - rect.left) * img.naturalWidth / rect.width),
                          y: Math.round((ev.clientY - rect.top) * img.naturalHeight / rect.height) };
    marker.style.left = `${100 * (ev.clientX - rect.left) / rect.width}%`;
    marker.style.top = `${100 * (ev.clientY - rect.top) / rect.height}%`;
    marker.style.display = "block"; unpick();
    $("make").disabled = !anyTap(); markMoments();
  });
  return { clear: () => { state.taps[which] = null; marker.style.display = "none"; unpick(); } };
}

// 장면 5개 줄: 누르면 그 장면을 연다. 고른 장면에는 ✓

// 폰의 공유 시트로 영상 파일을 넘긴다. 안 되는 브라우저는 저장으로
async function shareVideo(url, name) {
  try {
    const blob = await (await fetch(url)).blob();
    const file = new File([blob], name, { type: "video/mp4" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Tap Me Volleyball" }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
}
// 폰 공유 시트(Web Share)는 HTTPS 주소에서만 열린다. 쓸 수 없으면 '공유'를 숨기고 '저장'만 둔다
// (http 주소에서는 공유가 저장으로 대신 처리돼 두 버튼이 같았다, 10/30 사용자)
const CAN_SHARE = window.isSecureContext && typeof navigator.share === "function" && typeof navigator.canShare === "function";

$("reel-share").onclick = () => shareVideo($("reel-download").href, $("reel-download").download || "reel.mp4");

// 저장 파일 이름: 경기이름_팀이름_하이라이트_01.mp4 (여러 개 저장해도 겹치지 않게, 10/30 사용자 요청)
function fileName(s, team, kind, number) {
  const clean = (x) => String(x || "").replace(/[\\/:*?"<>|#%]+/g, "").trim().replace(/\s+/g, "_");
  const parts = [clean(s && s.match_name), clean(team), kind].filter(Boolean);
  if (number) parts.push(String(number).padStart(2, "0"));
  return parts.join("_") + ".mp4";
}

// 서버에 맡기기(이어 올리기, 10/31 사용자: 업로드 중 화면을 끄면 처음부터 다시 올려야 했다): 원본을 16MB씩 올리고,
// 끊기면 서버가 받은 곳부터 잇는다. 이어 올릴 자리는 이 기기에 기억해 화면을 새로 열고 같은 영상을 다시 골라도 이어진다
const UP_PIECE = 16 * 1024 * 1024;
async function uploadVideo(f) {
  setError(""); $("resume-upload").hidden = true; $("up-progress").hidden = false; $("upload-warn").hidden = false;
  state.uploading = true; state.uploadFile = f; state.uploadPaused = false; keepAwake(true);
  const sig = `${f.name}|${f.size}|${f.lastModified}`;
  try {
    let sess = null, received = 0;
    try { sess = JSON.parse(storeGet("upload") || "null"); } catch { sess = null; }
    if (sess && sess.sig === sig) {
      try { received = (await api(`/uploads/${sess.id}`)).received; } catch { sess = null; }
    }
    if (!sess || sess.sig !== sig) {
      const body = { filename: f.name, size: f.size, match: $("match-name").value, code: $("code").value.trim() };
      if (state.range) { body.start = state.range[0]; body.end = state.range[1]; }
      const r = await postJson("/uploads", body);
      sess = { id: r.id, sig }; storeSet("upload", JSON.stringify(sess));
    } else if (received > 0) $("up-status").textContent = t("uploadResumed", { p: Math.round(100 * received / f.size) });
    const t0 = Date.now(), r0 = received;
    while (received < f.size) {
      const r = await fetch(`/uploads/${sess.id}?offset=${received}`, { method: "PUT", body: f.slice(received, Math.min(f.size, received + UP_PIECE)) });
      if (r.status === 409) { received = (await r.json()).detail.received; continue; }  // 서버가 받은 곳에 맞춘다
      if (!r.ok) throw new Error(t("uploadFail", { c: r.status }));
      received = (await r.json()).received;
      const rate = (received - r0) / Math.max(0.5, (Date.now() - t0) / 1000), left = (f.size - received) / rate;
      $("up-progress").firstElementChild.style.transform = `scaleX(${received / f.size})`;
      $("up-status").textContent = t("uploading", { p: Math.round(100 * received / f.size) }) + (left > 5 ? " · " + t("etaLeft", { m: fmtLeft(left), c: clockAt(left) }) : "");
    }
    const j = await postJson(`/uploads/${sess.id}/finish`, {});
    storeSet("upload", "");
    $("upload-warn").hidden = true; $("started-note").hidden = true; state.uploading = false; state.uploadFile = null; keepAwake(false);
    state.job = j.id; state.rally = null; setHash(); startPolling(); subscribePush(state.job);
  } catch (e) {
    state.uploading = false; keepAwake(false); $("upload-warn").hidden = true;
    // 연결이 끊긴 것(화면 꺼짐 등)이면 이어 올리게, 서버가 거절한 것(코드·한도)이면 그대로 알린다
    if (e instanceof TypeError) { state.uploadPaused = true; $("resume-upload").hidden = false; setError(t("uploadPaused")); }
    else { setError(e.message); $("start-upload").disabled = false; $("up-progress").hidden = true; }
  }
}
$("resume-upload").onclick = () => uploadVideo(state.uploadFile || state.pending);
// 화면으로 돌아오면 멈춘 업로드·기기 처리를 저절로 잇는다
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (state.uploadPaused && (state.uploadFile || state.pending)) $("resume-upload").click();
  else if (state.localPaused && state.local) resumeBrowser(state.local.file);
});
// 한 번에 훑는 길이(서버 jobs.MAX_SCAN_SEC와 같게). 더 긴 영상은 구간을 고른다 — 파일을 자르지 않고 그 구간만 훑는다(10/31 사용자)
const MAX_SCAN_MIN = 30, MAX_SCAN = MAX_SCAN_MIN * 60;
const rangeVideo = $("range-video");
function setRange(s, e) {
  const d = rangeVideo.duration;
  s = Math.min(Math.max(0, s), d - 1);
  e = Math.min(Math.max(e, s + 1), d, s + MAX_SCAN);
  state.range = [s, e]; renderRange();
}
function renderRange() {
  const d = rangeVideo.duration;
  if (!state.range || !d) return;
  const [s, e] = state.range, m = MAX_SCAN_MIN;
  $("range-note").textContent = t("rangeNote", { d: fmt(d), m });
  $("range-label").textContent = t("rangeLabel", { s: fmt(s), e: fmt(e), m: Math.round((e - s) / 60) });
  $("range-fill").style.left = `${100 * s / d}%`; $("range-fill").style.width = `${100 * (e - s) / d}%`;
  $("range-first").textContent = t("rangeFirst", { m }); $("range-next").textContent = t("rangeNext", { m }); $("range-last").textContent = t("rangeLast", { m });
  $("range-next").disabled = e >= d - 1;
}
// 시작을 옮기면 끝은 그대로 두되 30분을 넘으면 당기고, 끝을 옮기면 시작을 당긴다
$("range-start").onclick = () => { const s = rangeVideo.currentTime, e = state.range[1]; setRange(s, e > s && e - s <= MAX_SCAN ? e : s + MAX_SCAN); };
$("range-end").onclick = () => { const e = rangeVideo.currentTime, s = state.range[0]; setRange(s < e && e - s <= MAX_SCAN ? s : e - MAX_SCAN, e); };
$("range-first").onclick = () => setRange(0, MAX_SCAN);
$("range-next").onclick = () => { const e = state.range[1]; setRange(e, e + MAX_SCAN); rangeVideo.currentTime = e; };
$("range-last").onclick = () => { const d = rangeVideo.duration; setRange(d - MAX_SCAN, d); rangeVideo.currentTime = d - MAX_SCAN; };
// 브라우저에서 영상 길이를 읽어 30분보다 길 때만 구간 고르기를 보인다. 못 읽으면 서버가 앞 30분만 훑는다
function checkLength(f) {
  state.range = null; $("range").hidden = true; $("range").classList.remove("unknown"); $("range-note").textContent = "";
  if (rangeVideo.src) URL.revokeObjectURL(rangeVideo.src);
  rangeVideo.onloadedmetadata = () => {
    if (rangeVideo.duration > MAX_SCAN) { $("range").hidden = false; setRange(0, MAX_SCAN); }
  };
  rangeVideo.onerror = () => { $("range").hidden = false; $("range").classList.add("unknown"); $("range-note").textContent = t("rangeUnknown", { m: MAX_SCAN_MIN }); };
  rangeVideo.src = URL.createObjectURL(f);
}

// 고르거나 끌어다 놓으면 바로 올리지 않고, 파일을 보여 준 뒤 "시작"을 눌러야 올린다(10/30 사용자)
function pickVideo(f) {
  state.pending = f;
  checkLength(f);
  const mb = f.size / (1024 * 1024);
  $("picked-name").textContent = `${f.name}  ${mb >= 1024 ? (mb / 1024).toFixed(2) + " GB" : mb.toFixed(0) + " MB"}`;
  $("picked").hidden = false;
  document.querySelector(".drop").classList.add("has-file");
  const label = document.querySelector(".drop span"); label.dataset.t = "pickAgain"; label.textContent = t("pickAgain");
  setError("");
}

// 브라우저 방식(10/31, H-45): 이 기기에서 얼굴을 흐려 1분 조각만 올린다. 원본은 기기에 남는다. 처음 몇 장이 느리거나
// 이 기기가 영상을 못 풀면 원본을 올려 서버가 흐린다(지금까지의 방식)
function canBlurHere(f) {
  return window.BrowserBlur && BrowserBlur.supported() && /\.(mp4|mov|m4v)$/i.test(f.name) && rangeVideo.duration > 0;
}
// 예상 완료 시각(10/31 사용자: 언제 확인할 수 있는지가 관건)
function clockAt(sec) { return new Date(Date.now() + sec * 1000).toLocaleTimeString(state.lang, { hour: "numeric", minute: "2-digit" }); }
// 랠리 찾기 남은 시간: 조각이 끝나는 빠르기로 어림한다. 첫 조각 전에는 서버 실측(영상 1초당 초)으로
function scanEta(s) {
  const sc = s.scan || {}, now = Date.now();
  if (!sc.total) return "";
  if (!state.scanSeen || state.scanSeen.job !== state.job) state.scanSeen = { job: state.job, t0: now, d0: sc.done || 0 };
  const seen = state.scanSeen, done = (sc.done || 0) - seen.d0;
  const range = s.scan_range && s.scan_range.length === 2 ? s.scan_range[1] - s.scan_range[0] : s.duration_sec;
  // 서버는 조각 여러 개를 함께 보므로 한두 개 끝났을 때의 속도로 재면 남은 시간이 부풀었다(4→6분으로 늘었다가 2분, 10/31 아이폰).
  // 그래서 처음 예상(길이 × 영상 1초당 처리 초 + 마지막 조각 1분)에서 지난 시간을 빼 쓰고, 실제 속도는 조각이 3개 넘게
  // 끝났을 때만 쓴다. 예상을 넘기면 큰 숫자 대신 "조금 더 걸리고 있어요". 기기 방식은 조각이 하나씩 오므로 실제 속도로

// 화면 꺼짐 막기: 기기에서 흐리거나 원본을 올리는 동안(폰이 잠기면 멈춘다). 지원하지 않는 브라우저는 그냥 넘어간다

// 시작 전 선택: 기기 속도를 재고 두 방식의 예상 시간을 보여 준다. 기기가 못 하는 영상이면 서버만

  let step = canDevice && !useSaved ? "libs" : "net", n = 0;

  const show = () => {

// 미리 재기(10/31 사용자: 영상을 올리기 전에 이 기기가 어느 정도인지 미리 알고 싶다). 사람 없는 시험 영상을 이 기기에서
// 만들어 실제처럼 잰다(browser-blur.js bench). 결과는 이 기기에 저장해 두고 영상을 고르면 그 값으로 바로 비교한다
function benchSaved() { try { return JSON.parse(storeGet("bench") || "null"); } catch { return null; } }

$("bench-go").onclick = async () => {

// 고르면 무엇이 시작됐는지 그 자리에 남기고, 진행 상황이 있는 곳으로 화면을 옮긴다
function started(key, target) {

// 완료 알림(웹 푸시, 10/31 사용자: 끝나면 알려 주고 다음 할 일을 안내). 안드로이드 크롬은 브라우저에서 바로, 아이폰은
// 홈 화면에 추가한 앱에서만 된다. 허용은 사용자가 방식을 고르는 순간(누른 그 자리에서) 묻고, 작업이 생기면 구독을 보낸다
const IOS = /iPhone|iPad/.test(navigator.userAgent), STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const PUSH_OK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
function pushHint() {
  $("push-hint").hidden = false;
  $("push-hint").textContent = PUSH_OK && Notification.permission !== "denied" ? t("pushHint") : IOS && !STANDALONE ? t("pushHintIos") : "";
  $("push-hint").hidden = !$("push-hint").textContent;
}
function askPush() {
  if (PUSH_OK && Notification.permission === "default") Notification.requestPermission().catch(() => {});
}
const subscribed = new Set();
async function subscribePush(jobId) {
  if (!PUSH_OK || subscribed.has(jobId)) return;
  try {
    if (Notification.permission === "default") await new Promise((ok) => setTimeout(ok, 3000));  // 허용 창에 답할 시간
    if (Notification.permission !== "granted") return;
    const { key } = await api("/push/key");
    if (!key) return;
    const reg = await navigator.serviceWorker.ready;
    const raw = atob(key.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - key.length % 4) % 4));
    const sub = await reg.pushManager.getSubscription()
      || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, (c) => c.charCodeAt(0)) });
    await postJson(`/jobs/${jobId}/push`, { subscription: sub.toJSON(), lang: state.lang });
    subscribed.add(jobId);
  } catch { /* 알림이 안 돼도 처리는 계속된다 */ }
}
function fmtLeft(sec) { return sec >= 60 ? t("min", { n: Math.ceil(sec / 60) }) : t("sec", { n: Math.max(1, Math.ceil(sec)) }); }
function setLocal(text, frac) {
  $("local-box").hidden = false; $("local-step").textContent = text;
  $("local-progress").firstElementChild.style.transform = `scaleX(${frac})`;
}
async function startBrowser(f) {
  const dur = rangeVideo.duration, [start, end] = state.range || [0, Math.min(dur, MAX_SCAN)];
  state.localBusy = true; setLocalError(""); setLocal(t("localPrep"), 0); keepAwake(true);
  $("charge-tip").hidden = !(state.deviceEstSec > 600);
  let created = false;
  try {
    const r = await BrowserBlur.run({
      file: f, start, end, force: true,  // 사용자가 예상 시간을 보고 '이 기기에서'를 골랐다
      onProgress: (p) => setLocal(t("localStep", { p: Math.round(100 * p.done / p.total), m: fmtLeft(p.secLeft), c: clockAt(p.secLeft) }), p.done / p.total),
      createJob: async () => {
        const j = await postJson("/jobs/browser", { filename: f.name, duration: dur, start, end, match: $("match-name").value,
                                                    code: $("code").value.trim(), size: f.size }).catch((e) => { e.fromServer = true; throw e; });
        created = true;
        state.job = j.id; state.rally = null; state.local = { file: f, url: URL.createObjectURL(f) };
        setHash(); startPolling(); subscribePush(j.id);
        return j.chunks;
      },
      uploadChunk: sendChunk,

    if (r === "slow") { state.localBusy = false; $("local-box").hidden = true; $("up-status").textContent = t("localSlow"); uploadVideo(f); return; }

// 이어서 처리하기: 서버가 받은 조각은 건너뛰고 빠진 첫 조각의 시작부터 다시 흐린다(같은 작업, 횟수를 더 쓰지 않음)

// 동의(10/31 사용자 결정): 어떤 AI로 무엇이 가는지 보고 동의해야 올릴 수 있다. 한 번 동의하면 이 기기에서 기억한다

// 초대 링크(배구구 배너·심사용, 10/31 사용자 결정): ?invite=… 으로 오면 이 기기에 코드가 없을 때만 하나 받는다

window.addEventListener("dragenter", (e) => { if (!canDrop()) return; e.preventDefault(); dragDepth++; dropZone.classList.add("is-over"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; dropZone.classList.remove("is-over"); } });
window.addEventListener("dragover", (e) => e.preventDefault());  // 놓은 파일을 브라우저가 열어 버리지 않게
window.addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; dropZone.classList.remove("is-over");
  if (!canDrop()) return;
  const f = [...((e.dataTransfer && e.dataTransfer.files) || [])].find(isVideo);
  if (f) pickVideo(f); else setError(t("dropNotVideo"));
});

initLang();
// 새로고침해도 이어서 한다
const params = new URLSearchParams(location.hash.slice(1));
if (params.get("job")) {
  state.job = params.get("job");
  state.rally = params.has("rally") ? Number(params.get("rally")) : null;
  startPolling();
}
</script>
</body>
