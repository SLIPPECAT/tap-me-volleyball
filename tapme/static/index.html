<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Me Volleyball</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tap Me">
<meta name="theme-color" content="#0c111d">
<style>
  :root { --fg: #14181f; --muted: #667085; --line: #e4e7ec; --bg: #ffffff; --card: #f9fafb; --accent: #0091b3; --warn: #b54708; --bad: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f2f4f7; --muted: #98a2b3; --line: #344054; --bg: #0c111d; --card: #121826; --accent: #3ec5e6; --warn: #fdb022; --bad: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Hiragino Sans", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 17px; margin: 20px 0 8px; }
  .langs-ui button { padding: 4px 8px; font-size: 13px; border-radius: 8px; }
  .langs-ui button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); font-size: 14px; }
  .error { color: var(--bad); font-weight: 600; }
  button, select, input[type=text] { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; }
  button:disabled { opacity: .5; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; margin: 8px 0; }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card.rally { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
  .thumb { position: relative; padding: 0; border: 0; border-radius: 8px; overflow: hidden; width: 96px; aspect-ratio: 9 / 16; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .card.rally video { grid-column: 1 / -1; max-height: 70vh; object-fit: contain; }
  .tag { font-size: 13px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .tag.yes { color: var(--accent); } .tag.no { color: var(--muted); } .tag.unsure { color: var(--warn); } .tag.done { color: var(--fg); }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px; text-align: center; cursor: pointer; }
  .drop input { display: none; }
  .tapzoom { overflow: auto; border-radius: 10px; max-height: 70vh; -webkit-overflow-scrolling: touch; }
  .tapwrap { position: relative; width: 100%; }
  .tapwrap img { width: 100%; display: block; }
  .marker { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border: 3px solid var(--accent); border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .zoombar { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .cards { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; -webkit-overflow-scrolling: touch; }
  .cards button { flex: 0 0 auto; width: 64px; height: 96px; padding: 0; border: 3px solid transparent; border-radius: 8px; overflow: hidden; background: #000; }
  .cards button[aria-selected=true] { border-color: var(--accent); }
  .cards img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pickbox { position: absolute; border: 3px solid var(--accent); border-radius: 4px; pointer-events: none; display: none; box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .moments { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
  .moments button { position: relative; padding: 0; border: 3px solid transparent; border-radius: 8px; overflow: hidden; background: #000; color: #fff; }
  .moments button[aria-selected=true] { border-color: var(--accent); }
  .moments img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; opacity: .85; }
  .moments span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; padding: 2px; background: rgba(0,0,0,.6); }
  .moments b { position: absolute; top: 2px; right: 4px; color: var(--accent); font-size: 16px; }
  details { margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  summary { cursor: pointer; font-weight: 600; }
  .field { margin: 12px 0; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .sublangs label { display: inline-flex; gap: 6px; margin-right: 16px; color: var(--fg); font-size: 16px; }
  .field label.switch { display: inline-flex; gap: 8px; align-items: center; color: var(--fg); font-size: 16px; }
  .role { width: 100%; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opts select { width: 100%; }
  video { width: 100%; border-radius: 10px; background: #000; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tap Me Volleyball</h1>
    <div class="langs-ui" role="group" aria-label="Language">
      <button data-lang="ko">한</button><button data-lang="ja">日</button><button data-lang="en">EN</button>
    </div>
  </header>
  <p class="error" id="error" role="alert" hidden></p>

  <!-- 처리 중: 지금 단계 + 닫아도 됨 + 그동안 옵션 미리 정하기 -->
  <section id="wait-box" class="card" hidden>
    <p id="wait-step" aria-live="polite"></p>
    <p class="muted" id="wait-cost" hidden></p>
    <div class="progress" id="wait-progress"><div></div></div>
    <p class="muted" data-t="canClose"></p>
    <p><button id="copy-link" data-t="copyLink"></button></p>
    <details id="prefs-box">
      <summary data-t="prefsTitle"></summary>
      <div class="field"><label for="team-pref" data-t="teamLabel"></label><input type="text" id="team-pref" maxlength="20"></div>
      <div id="opts-prefs"></div>
    </details>
  </section>

  <!-- 1. 영상 올리기 -->
  <section id="s-upload">
    <p data-t="uploadIntro"></p>
    <p class="muted" data-t="captureTip"></p>
    <div class="field"><label for="match-name" data-t="matchLabel"></label><input type="text" id="match-name" maxlength="40"></div>
    <label class="drop"><span data-t="pickVideo"></span><input type="file" id="file" accept="video/*"></label>
    <div class="progress" id="up-progress" hidden><div></div></div>
    <p class="muted" id="up-status" aria-live="polite"></p>
    <p class="error" id="upload-warn" data-t="keepOpen" hidden></p>
  </section>

  <!-- 2. 랠리 후보 -->
  <section id="s-rallies" hidden>
    <h2 data-t="pickRally"></h2>
    <p class="muted" data-t="pickRallyHint"></p>
    <p class="card muted" id="scan-note" aria-live="polite" hidden></p>
    <div id="rally-list"></div>
    <p class="card muted" id="no-rallies" data-t="noRallies" hidden></p>
    <p class="card muted" id="unread" hidden></p>
    <div id="reel-box" hidden>
      <h2 data-t="reelTitle"></h2>
      <p class="muted" data-t="reelHint"></p>
      <div id="reel-pick"></div>
      <button class="primary" id="make-reel" data-t="makeReel"></button>
      <p class="muted" id="reel-status" aria-live="polite"></p>
      <video id="reel" controls playsinline hidden></video>
      <div class="actions" id="reel-actions" hidden>
        <button id="reel-share" data-t="share"></button><a id="reel-download" download="reel.mp4"><button style="width:100%" data-t="save"></button></a>
      </div>
    </div>
  </section>

  <!-- 3. 나를 탭 -->
  <section id="s-tap" hidden>
    <h2 data-t="tapTitle"></h2>
    <p class="muted" id="tap-status" aria-live="polite"></p>
    <div id="tap-box" hidden>
      <div class="moments" id="moments" role="tablist"></div>
      <p class="muted" id="players-status" aria-live="polite"></p>
      <div id="tapper-host"></div>
      <p><button id="clear-tap" data-t="clearTap"></button></p>
      <div class="field">
        <label for="team" data-t="teamLabel"></label>
        <input type="text" id="team" maxlength="20">
      </div>
      <div id="opts-tap"></div>
      <button class="primary" id="make" disabled data-t="make"></button>
    </div>
    <p><button id="back-rallies" data-t="otherRally"></button></p>
  </section>

  <!-- 4. 결과 -->
  <section id="s-result" hidden>
    <h2 data-t="resultTitle"></h2>
    <p class="muted" id="result-status" aria-live="polite"></p>
    <video id="result" controls playsinline hidden></video>
    <div class="actions" id="result-actions" hidden>
      <button id="share" data-t="share"></button><a id="download" download="highlight.mp4"><button style="width:100%" data-t="save"></button></a>
    </div>
    <h2 data-t="changeOptions"></h2>
    <p class="muted" data-t="rerenderHint"></p>
    <div id="opts-result"></div>
    <button class="primary" id="rerender" data-t="rerender"></button>
    <p><button id="back-rallies2" data-t="otherRally"></button></p>
  </section>

  <p class="muted" id="spent"></p>
</main>

<template id="tapper-tpl">
  <div class="cards" role="listbox"></div>
  <div class="zoombar">
    <button class="zout" aria-label="zoom out">−</button>
    <button class="zin" aria-label="zoom in">+</button>
    <span class="muted" data-t="zoomHint"></span>
  </div>
  <div class="tapzoom"><div class="tapwrap"><img alt=""><div class="marker"></div><div class="pickbox"></div></div></div>
</template>

<template id="opts-tpl">
  <div class="field"><label class="switch"><input type="checkbox" class="subs-on"> <span data-t="subsOn"></span></label></div>
  <div class="subs-box" hidden>
    <div class="field sublangs">
      <label data-t="subLangs"></label>
      <label><input type="checkbox" value="ko"> 한국어</label>
      <label><input type="checkbox" value="ja"> 日本語</label>
      <label><input type="checkbox" value="en"> English</label>
    </div>
    <div class="field"><label data-t="role"></label>
      <select class="role">
        <option value="" data-t="roleNone"></option>
        <option value="score" data-t="roleScore"></option>
        <option value="assist" data-t="roleAssist"></option>
        <option value="defense" data-t="roleDefense"></option>
      </select></div>
  </div>
  <div class="field"><label class="switch"><input type="checkbox" class="face-mosaic" checked> <span data-t="faceMosaic"></span></label></div>
  <div class="opts">
    <div class="field"><label data-t="privacy"></label>
      <select class="privacy">
        <option value="face" data-t="privFace"></option>
        <option value="silhouette" data-t="privSilhouette"></option>
        <option value="background" data-t="privBackground"></option>
      </select></div>
    <div class="field"><label data-t="zoom"></label>
      <select class="zoom">
        <option value="1" selected>1×</option><option value="1.5">1.5×</option>
        <option value="2">2×</option><option value="2.5">2.5×</option>
      </select></div>
    <div class="field"><label data-t="fps"></label>
      <select class="fps"><option value="0" selected data-t="fpsSource"></option><option value="30">30fps</option></select></div>
  </div>
</template>

const $ = (id) => document.getElementById(id);
const KINDS = ["score", "b1", "b2", "b3", "start"];
const KIND_LABEL = { score: "mScore", b1: "mB1", b2: "mB2", b3: "mB3", start: "mStart" };
const state = { job: null, rally: null, taps: {}, tappers: {}, moment: "score", poll: null, last: null, lang: "ko" };
const anyTap = () => Object.values(state.taps).some(Boolean);
const BASE_TITLE = document.title;
// 기다리는 동안 정한 옵션(팀 이름·자막·가리기…). 이 폰에만 저장, 탭 화면에 미리 채운다
state.prefs = (() => { try { return JSON.parse(localStorage.getItem("prefs") || "{}"); } catch { return {}; } })();
function savePrefs() { try { localStorage.setItem("prefs", JSON.stringify(state.prefs)); } catch { /* 저장 못 해도 동작에는 지장 없음 */ } }
state.busy = false;

function storeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch { /* 저장 못 해도 동작에는 지장 없음 */ } }
function t(key, vars = {}) { return (T[state.lang][key] || T.en[key] || key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ""); }
function applyLang() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs-ui button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  $("team").placeholder = t("teamPh");
  $("rally-list").dataset.key = "";  // 판정 이유를 새 언어로 다시 그린다
  if (state.last) render(state.last);
}
function initLang() {
  const saved = storeGet("lang");
  const nav = (navigator.language || "en").slice(0, 2);
  state.lang = T[saved] ? saved : T[nav] ? nav : "en";
  document.querySelectorAll(".langs-ui button").forEach((b) => { b.onclick = () => { state.lang = b.dataset.lang; storeSet("lang", state.lang); applyLang(); }; });
  applyLang();
}

function show(section) { for (const s of ["s-upload", "s-rallies", "s-tap", "s-result"]) $(s).hidden = s !== section; }
function setError(msg) { $("error").textContent = msg || ""; $("error").hidden = !msg; }
function setHash() { location.hash = state.job ? `job=${state.job}` + (state.rally !== null ? `&rally=${state.rally}` : "") : ""; }
function fmt(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${String(s).padStart(2, "0")}`; }
function reasonText(r) { return r && typeof r === "object" ? (r[state.lang] || r.en || "") : (r || ""); }
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || t("reqFail", { c: r.status }));
  return r.json();
}
const postJson = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function readOptions(box) {
  // 자막을 끄면 언어를 보내지 않는다 → 서버는 해설(Muse)을 묻지 않는다
  const on = box.querySelector(".subs-on").checked;
  const langs = [...box.querySelectorAll(".sublangs input:checked")].map((c) => c.value);
  return {
    languages: on ? (langs.length ? langs : [state.lang]) : [],
    role: on ? box.querySelector(".role").value : "",
    privacy: box.querySelector(".privacy").value,
    zoom: parseFloat(box.querySelector(".zoom").value),
    fps: parseInt(box.querySelector(".fps").value, 10),
    face_mosaic: box.querySelector(".face-mosaic").checked,
  };
}
function mountOptions(boxId, o) {
  const box = $(boxId);
  box.replaceChildren($("opts-tpl").content.cloneNode(true));
  box.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  const langs = o && o.languages.length ? o.languages : [state.lang];
  box.querySelectorAll(".sublangs input").forEach((c) => { c.checked = langs.includes(c.value); });
  const on = box.querySelector(".subs-on"), subsBox = box.querySelector(".subs-box");
  on.checked = Boolean(o && o.languages.length);
  subsBox.hidden = !on.checked;
  on.onchange = () => { subsBox.hidden = !on.checked; };
  if (o) {
    box.querySelector(".privacy").value = o.privacy; box.querySelector(".zoom").value = String(o.zoom); box.querySelector(".fps").value = String(o.fps || 0);
    box.querySelector(".role").value = o.role || "";
    box.querySelector(".face-mosaic").checked = o.face_mosaic !== false;
  }
}

// 상태를 2초마다 보고 지금 단계의 화면을 그린다
function startPolling() {
  clearInterval(state.poll);
  const tick = async () => {
    try { state.last = await api(`/jobs/${state.job}`); } catch (e) { setError(e.message); return; }
    render(state.last);
  };
  tick();
  state.poll = setInterval(tick, 2000);
}

function busyOf(s) {
  if (s.status === "uploaded" || s.status === "finding_rallies") return true;
  const sc = state.rally !== null && s.scenes[String(state.rally)];
  if (sc && (sc.status === "preparing" || sc.status === "rendering")) return true;
  return Boolean(s.reel && s.reel.status === "rendering");
}

function renderWait(s) {
  const busy = busyOf(s) && !s.error;
  $("wait-box").hidden = !busy;
  if (busy) {
    const sc = state.rally !== null && s.scenes[String(state.rally)];
    const sceneBusy = sc && (sc.status === "preparing" || sc.status === "rendering");
    const pr = s.status === "finding_rallies" && !sceneBusy ? { step: "rallies", ...(s.scan || {}) } : (s.progress || {});
    const key = pr.step ? "st" + pr.step[0].toUpperCase() + pr.step.slice(1) : "stWorking";
    const pct = pr.total ? Math.round(100 * pr.done / pr.total) : 0;
    $("wait-step").textContent = t(T[state.lang][key] ? key : "stWorking", { d: pr.done || 0, n: pr.total || 0, p: pct });
    $("wait-progress").hidden = !pr.total;
    // 긴 영상은 오래 걸리고 비용도 커서 랠리 찾는 동안 길이와 예상 비용을 보여 준다
    $("wait-cost").hidden = !(s.status === "finding_rallies" && s.estimate_usd);
    if (!$("wait-cost").hidden) $("wait-cost").textContent = t("waitCost", { m: Math.max(1, Math.round(s.duration_sec / 60)), u: s.estimate_usd.toFixed(2) });
    $("wait-progress").firstElementChild.style.width = `${pct}%`;
    if (!$("opts-prefs").children.length) {
      mountOptions("opts-prefs", state.prefs.options);
      $("team-pref").value = state.prefs.team || "";
    }
  }
  // 처리가 끝나면 진동, 화면을 안 보고 있으면 탭 제목에 ✓
  if (state.busy && !busy && !s.error) {
    if (navigator.vibrate) navigator.vibrate(200);
    if (document.hidden) document.title = "✓ " + BASE_TITLE;
  }
  state.busy = busy;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = BASE_TITLE; });
$("team-pref").addEventListener("input", () => { state.prefs.team = $("team-pref").value; savePrefs(); });
$("opts-prefs").addEventListener("change", () => { state.prefs.options = readOptions($("opts-prefs")); savePrefs(); });
$("copy-link").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("copy-link").textContent = t("copied"); }
  catch { prompt("", location.href); }  // http 주소에서는 클립보드가 막힐 수 있다
};

function render(s) {
  setError(s.error);
  renderWait(s);
  $("spent").textContent = t("spent", { u: s.spent_usd.toFixed(3) });
  if (state.rally === null) return renderRallies(s);
  const scene = s.scenes[String(state.rally)];
  if (!scene || scene.status === "preparing") {
    show("s-tap"); $("tap-status").textContent = s.error ? "" : t("preparing"); $("tap-box").hidden = true;
  } else if (scene.status === "awaiting_tap") {
    show("s-tap"); renderTap();
  } else if (scene.status === "rendering") {
    if ($("s-result").hidden) { show("s-tap"); $("tap-status").textContent = t("rendering"); $("tap-box").hidden = true; }
    else { $("result-status").textContent = t("rerenderBusy"); }
    $("make").disabled = $("rerender").disabled = true;
  } else if (scene.status === "done") {
    renderResult(scene);
  }
}

function renderRallies(s) {
  // 처리 중에는 올리기 칸을 숨긴다(다시 올리는 실수 방지). 기다림 상자가 대신 보인다
  // 긴 영상은 찾은 랠리부터 보여 주어 다 끝나기 전에 골라 만들 수 있게 한다(10/30)
  const partial = s.status === "finding_rallies" && s.rallies.length > 0;
  show(s.status === "rallies_ready" || partial ? "s-rallies" : busyOf(s) && !s.error ? null : "s-upload");
  if (s.status !== "rallies_ready" && !partial) { $("up-status").textContent = s.error ? "" : t("findingRallies"); return; }
  $("scan-note").hidden = !partial;
  if (partial) $("scan-note").textContent = t("scanNote", { d: s.scan.done || 0, n: s.scan.total || 0 });
  renderReel(s);
  $("no-rallies").hidden = s.rallies.length > 0 || partial;
  const unread = s.unread || [];
  $("unread").hidden = !unread.length;
  $("unread").textContent = t("unread", { r: unread.map(([a, b]) => `${fmt(a)}~${fmt(b)}`).join(", ") });
  const list = $("rally-list");
  const key = `${state.job}|${state.lang}|${s.rallies.length}|${Object.entries(s.scenes).map(([k, v]) => k + v.status).join(",")}`;
  if (list.dataset.key === key) return;
  list.dataset.key = key;
  // 찾는 도중 붙은 랠리는 번호 순서가 시간 순서와 다를 수 있어 시간 순으로 보여 준다
  list.replaceChildren(...[...s.rallies].sort((a, b) => a.start_sec - b.start_sec).map((r) => {
    const scene = s.scenes[String(r.index)];
    const card = document.createElement("div"); card.className = "card rally";
    // 장면 사진. 누르면 그 구간 미리보기를 카드 안에서 재생한다(시간만으로는 어떤 장면인지 모른다)
    const thumb = document.createElement("button"); thumb.className = "thumb"; thumb.setAttribute("aria-label", t("preview"));
    const img = document.createElement("img"); img.loading = "lazy"; img.alt = "";
    img.src = `/jobs/${state.job}/rallies/${r.index}/thumb`;
    const play = document.createElement("span"); play.textContent = "▶";
    thumb.append(img, play);
    thumb.onclick = () => {
      // 미리보기를 보는 동안 뒤에서 장면을 미리 준비한다(비용 없을 때만, 서버가 판단). 고르면 탭 화면이 바로 뜬다
      fetch(`/jobs/${state.job}/rallies/${r.index}/prepare?ahead=true`, { method: "POST" }).catch(() => {});
      const v = document.createElement("video");
      v.src = `/jobs/${state.job}/rallies/${r.index}/preview`; v.controls = true; v.autoplay = true; v.playsInline = true;
      thumb.replaceWith(v);
    };
    const info = document.createElement("div");
    const row = document.createElement("div"); row.className = "row";
    const time = document.createElement("strong"); time.textContent = `${fmt(r.start_sec)} ~ ${fmt(r.end_sec)}`;
    const tag = document.createElement("span");
    const kind = scene && scene.status === "done" ? "done" : r.uncertain ? "unsure" : r.is_rally ? "yes" : "no";
    tag.className = `tag ${kind}`;
    tag.textContent = t({ done: "done", unsure: "unsure", yes: "rally", no: "notRally" }[kind]);
    row.append(time, tag);
    const reason = document.createElement("p"); reason.className = "muted"; reason.textContent = reasonText(r.reason);
    const pick = document.createElement("button"); pick.textContent = scene ? t("open") : t("makeFromRally");
    pick.onclick = async () => {
      state.rally = r.index; setHash();
      // 이미 준비했거나 만든 장면은 그대로 연다. 다시 준비하면 돈이 또 들고 결과가 지워진다
      const sc = state.last && state.last.scenes[String(r.index)];
      // 미리 준비 중(preparing)이면 기다리기만 한다. 준비하다 실패했을 때만 다시 요청
      if (!sc || (sc.status === "preparing" && state.last.error)) {
        try { await api(`/jobs/${state.job}/rallies/${r.index}/prepare`, { method: "POST" }); } catch (e) { setError(e.message); }
      }
      startPolling();
    };
    info.append(row, reason, pick);
    card.append(thumb, info);
    return card;
  }));
}

function renderReel(s) {
  const done = Object.values(s.scenes).filter((sc) => sc.status === "done").sort((a, b) => a.score_sec - b.score_sec);
  $("reel-box").hidden = done.length < 2;
  if (done.length < 2) return;
  const key = done.map((d) => d.index).join(",") + state.lang;
  if ($("reel-pick").dataset.key !== key) {
    $("reel-pick").dataset.key = key;
    $("reel-pick").replaceChildren(...done.map((d) => {
      const label = document.createElement("label"); label.style.display = "block";
      const box = document.createElement("input"); box.type = "checkbox"; box.value = d.index; box.checked = true;
      label.append(box, " " + t("scoreAt", { t: fmt(d.score_sec) }));
      return label;
    }));
  }
  const reel = s.reel || {};
  $("make-reel").disabled = reel.status === "rendering";
  $("reel-status").textContent = reel.status === "rendering" ? t("reelBusy") : "";
  if (reel.status === "done") {
    const url = `/jobs/${state.job}/reel/video?v=${reel.order.join("-")}`;
    if ($("reel").dataset.src !== url) { $("reel").src = url; $("reel").dataset.src = url; }
    $("reel").hidden = $("reel-actions").hidden = false;
    $("reel-download").href = url;
    const first = s.scenes[String(reel.order[0])] || {};
    $("reel-download").download = fileName(s, first.team, t("fileReel"));
  }
}

$("make-reel").onclick = async () => {
  const order = [...$("reel-pick").querySelectorAll("input:checked")].map((c) => Number(c.value));
  if (order.length < 1) { setError(t("pickOne")); return; }
  $("make-reel").disabled = true;
  try { await postJson(`/jobs/${state.job}/reel`, { order }); } catch (e) { setError(e.message); $("make-reel").disabled = false; }
};

// 탭할 장면 하나: 확대(1~4배) + 탭 위치 표시. 화면 위치를 원본 이미지 픽셀로 바꿔 둔다(확대해도 같은 계산)
function makeTapper(boxId, which, players) {
  const box = $(boxId);
  box.replaceChildren($("tapper-tpl").content.cloneNode(true));
  box.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  const zoomBox = box.querySelector(".tapzoom"), wrap = box.querySelector(".tapwrap");
  const img = box.querySelector(".tapwrap img"), marker = box.querySelector(".marker"), pickbox = box.querySelector(".pickbox");
  const cards = box.querySelector(".cards");
  const unpick = () => { cards.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", "false")); pickbox.style.display = "none"; };
  // 선수 카드: 고르면 사진 위 그 선수에 테두리. 박스는 원본 이미지 픽셀 → 비율로 그린다
  cards.hidden = !players.length;
  players.forEach(([l, tp, r, b], n) => {
    const btn = document.createElement("button");
    btn.setAttribute("role", "option"); btn.setAttribute("aria-selected", "false"); btn.setAttribute("aria-label", `#${n + 1}`);
    const im = document.createElement("img"); im.alt = ""; im.loading = "lazy";
    im.src = `/jobs/${state.job}/rallies/${state.rally}/player?which=${which}&n=${n}`;
    btn.append(im);
    btn.onclick = () => {
      unpick(); btn.setAttribute("aria-selected", "true"); marker.style.display = "none";
      state.taps[which] = { player: n };
      const W = img.naturalWidth || 1080, H = img.naturalHeight || 1920;
      Object.assign(pickbox.style, { left: `${100 * l / W}%`, top: `${100 * tp / H}%`, width: `${100 * (r - l) / W}%`,
                                     height: `${100 * (b - tp) / H}%`, display: "block" });
      $("make").disabled = !anyTap(); markMoments();
    };
    cards.append(btn);
  });
  let zoom = 1;
  const setZoom = (z) => {
    zoom = Math.min(4, Math.max(1, z));
    const cx = (zoomBox.scrollLeft + zoomBox.clientWidth / 2) / wrap.offsetWidth, cy = (zoomBox.scrollTop + zoomBox.clientHeight / 2) / wrap.offsetHeight;
    wrap.style.width = `${zoom * 100}%`;
    zoomBox.scrollLeft = cx * wrap.offsetWidth - zoomBox.clientWidth / 2;
    zoomBox.scrollTop = cy * wrap.offsetHeight - zoomBox.clientHeight / 2;
  };
  box.querySelector(".zin").onclick = () => setZoom(zoom + 1);
  box.querySelector(".zout").onclick = () => setZoom(zoom - 1);
  img.alt = t("tapTitle");
  img.src = `/jobs/${state.job}/rallies/${state.rally}/tap-frame?which=${which}`;
  img.addEventListener("click", (ev) => {
    const rect = img.getBoundingClientRect();
    state.taps[which] = { x: Math.round((ev.clientX - rect.left) * img.naturalWidth / rect.width),
                          y: Math.round((ev.clientY - rect.top) * img.naturalHeight / rect.height) };
    marker.style.left = `${100 * (ev.clientX - rect.left) / rect.width}%`;
    marker.style.top = `${100 * (ev.clientY - rect.top) / rect.height}%`;
    marker.style.display = "block"; unpick();
    $("make").disabled = !anyTap(); markMoments();
  });
  return { clear: () => { state.taps[which] = null; marker.style.display = "none"; unpick(); } };
}

// 장면 5개 줄: 누르면 그 장면을 연다. 고른 장면에는 ✓
function markMoments() {
  $("moments").querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.kind === state.moment));
    b.querySelector("b").textContent = state.taps[b.dataset.kind] ? "✓" : "";
  });
}

async function openMoment(kind) {
  state.moment = kind; markMoments();
  Object.entries(state.tappers).forEach(([k, el]) => { el.hidden = k !== kind; });
  if (state.tappers[kind]) return;
  const host = document.createElement("div"); host.id = `tapper-${kind}`;
  $("tapper-host").append(host); state.tappers[kind] = host;
  $("players-status").textContent = t("findingPlayers");
  let players = [];
  try { players = (await api(`/jobs/${state.job}/rallies/${state.rally}/players?which=${kind}`, { method: "POST" })).players; }
  catch (e) { setError(e.message); }  // 선수 카드를 못 만들어도 사진을 직접 탭할 수 있다
  $("players-status").textContent = "";
  host.clear = makeTapper(host.id, kind, players).clear;
}

function renderTap() {
  $("tap-status").textContent = t("tapHint");
  const key = `${state.job}/${state.rally}`;
  if ($("tap-box").dataset.key !== key) {
    $("tap-box").dataset.key = key;
    state.taps = {}; state.tappers = {}; $("tapper-host").replaceChildren();
    const sc = (state.last && state.last.scenes[String(state.rally)]) || {};
    const kinds = KINDS.filter((k) => sc.tap_frames && k in sc.tap_frames);  // 예전 장면은 2장면만 있다
    $("moments").style.gridTemplateColumns = `repeat(${kinds.length}, 1fr)`;
    $("moments").replaceChildren(...kinds.map((kind) => {
      const b = document.createElement("button"); b.dataset.kind = kind; b.setAttribute("role", "tab");
      const im = document.createElement("img"); im.alt = "";
      im.src = `/jobs/${state.job}/rallies/${state.rally}/tap-frame?which=${kind}`;
      const label = document.createElement("span"); label.textContent = t(KIND_LABEL[kind]);
      b.append(im, label, document.createElement("b"));
      b.onclick = () => openMoment(kind);
      return b;
    }));
    openMoment("score");
  }
  $("tap-box").hidden = false;
  if (!$("opts-tap").children.length) {
    mountOptions("opts-tap", state.prefs.options);
    if (state.prefs.team && !$("team").value) $("team").value = state.prefs.team;
  }
  $("make").disabled = !anyTap();
}
$("clear-tap").onclick = () => { const host = state.tappers[state.moment]; if (host && host.clear) host.clear(); markMoments(); $("make").disabled = !anyTap(); };

$("make").onclick = async () => {
  const taps = Object.entries(state.taps).filter(([, v]) => v)
    .map(([which, v]) => (v.player !== undefined ? { which, player: v.player } : { which, x: v.x, y: v.y }));
  const body = { taps, team: $("team").value.trim() || t("ourTeam"), ...readOptions($("opts-tap")) };
  $("make").disabled = true;
  try { await postJson(`/jobs/${state.job}/rallies/${state.rally}/highlight`, body); } catch (e) { setError(e.message); $("make").disabled = false; }
};

function renderResult(scene) {
  show("s-result");
  const url = `/jobs/${state.job}/rallies/${state.rally}/video?v=${encodeURIComponent(JSON.stringify(scene.options))}`;
  if ($("result").dataset.src !== url) { $("result").src = url; $("result").dataset.src = url; }
  $("result").hidden = $("result-actions").hidden = false;
  $("download").href = url;
  $("download").download = fileName(state.last, scene.team, t("fileHighlight"), scene.number);
  const lines = (scene.options.languages.length && scene.commentary) || [];
  $("result-status").textContent = lines.length ? t("commentary", { c: lines.map((l) => l[state.lang] || l.en).join(" → ") }) : "";
  if (!$("opts-result").children.length) mountOptions("opts-result", scene.options);
  $("rerender").disabled = false;
}

$("rerender").onclick = async () => {
  $("rerender").disabled = true;
  try { await postJson(`/jobs/${state.job}/rallies/${state.rally}/rerender`, readOptions($("opts-result"))); }
  catch (e) { setError(e.message); $("rerender").disabled = false; }
};

// 폰의 공유 시트로 영상 파일을 넘긴다. 안 되는 브라우저는 저장으로
async function shareVideo(url, name) {
  try {
    const blob = await (await fetch(url)).blob();
    const file = new File([blob], name, { type: "video/mp4" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Tap Me Volleyball" }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
}
$("share").onclick = () => shareVideo($("download").href, $("download").download || "highlight.mp4");
$("reel-share").onclick = () => shareVideo($("reel-download").href, $("reel-download").download || "reel.mp4");

// 저장 파일 이름: 경기이름_팀이름_하이라이트_01.mp4 (여러 개 저장해도 겹치지 않게, 10/30 사용자 요청)
function fileName(s, team, kind, number) {
  const clean = (x) => String(x || "").replace(/[\\/:*?"<>|#%]+/g, "").trim().replace(/\s+/g, "_");
  const parts = [clean(s && s.match_name), clean(team), kind].filter(Boolean);
  if (number) parts.push(String(number).padStart(2, "0"));
  return parts.join("_") + ".mp4";
}

for (const id of ["back-rallies", "back-rallies2"]) {
  $(id).onclick = () => { state.rally = null; $("opts-result").replaceChildren(); $("opts-tap").replaceChildren(); setHash(); startPolling(); };
}

// 업로드: 진행률을 보여 주려고 XHR을 쓴다
$("file").addEventListener("change", () => {
  const f = $("file").files[0]; if (!f) return;
  const form = new FormData(); form.append("file", f); form.append("match", $("match-name").value);
  const xhr = new XMLHttpRequest();
  $("up-progress").hidden = false; $("upload-warn").hidden = false; setError("");
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const p = Math.round(100 * e.loaded / e.total);
    $("up-progress").firstElementChild.style.width = `${p}%`; $("up-status").textContent = t("uploading", { p });
  };
  xhr.onload = () => {
    $("upload-warn").hidden = true;
    if (xhr.status !== 200) { setError(t("uploadFail", { c: xhr.status })); return; }
    state.job = JSON.parse(xhr.responseText).id; state.rally = null; setHash(); startPolling();
  };
  xhr.onerror = () => { $("upload-warn").hidden = true; setError(t("uploadFail", { c: "network" })); };
  xhr.open("POST", "/jobs"); xhr.send(form);
});

initLang();
// 새로고침해도 이어서 한다
const params = new URLSearchParams(location.hash.slice(1));
if (params.get("job")) {
  state.job = params.get("job");
  state.rally = params.has("rally") ? Number(params.get("rally")) : null;
  startPolling();
}
</script>
